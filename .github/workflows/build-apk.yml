name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/debug/app-debug.apk release_out/The_Grand_Saga_World_History_v1.0.apk
          ls -la release_out/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The_Grand_Saga_World_History_APK
          path: release_out/The_Grand_Saga_World_History_v1.0.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_out/The_Grand_Saga_World_History_v1.0.apk
          name: The Grand Saga of World History (${{ github.ref_name }})
          draft: false
          prerelease: false
          generate_release_notes: true
